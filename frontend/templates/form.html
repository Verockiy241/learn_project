<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма трека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-body-tertiary">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-4">{% if track %}Редактирование трека{% else %}Новый трек{% endif %}</h2>

                        <form method="post" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Название *</label>
                                <input type="text" name="title" class="form-control" required value="{{ track.title if track else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Исполнитель *</label>
                                <input type="text" name="artist" class="form-control" required value="{{ track.artist if track else '' }}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Жанр</label>
                                <div class="input-group">
                                    <input type="text" id="genreInput" name="genre" class="form-control"
                                           value="{{ track.genre if track and track.genre else '' }}"
                                           autocomplete="off" placeholder="Выберите или введите...">

                                    <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                                            data-bs-toggle="dropdown" aria-expanded="false" title="Показать список">
                                    </button>

                                    <ul class="dropdown-menu dropdown-menu-end w-100">
                                        {% if genres %}
                                            {% for g in genres %}
                                            <li>
                                                <a class="dropdown-item" href="#" onclick="selectGenre('{{ g }}'); return false;">{{ g }}</a>
                                            </li>
                                            {% endfor %}
                                        {% else %}
                                            <li><span class="dropdown-item-text text-muted">Нет сохраненных жанров</span></li>
                                        {% endif %}
                                    </ul>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Тональность</label>
                                <input type="text" name="track_key" class="form-control" value="{{ track.track_key if track and track.track_key else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Темп (BPM)</label>
                                <input type="number" name="bpm" min="1" class="form-control" value="{{ track.bpm if track and track.bpm else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Длительность (сек)</label>
                                <input type="number" name="duration_sec" min="1" class="form-control" value="{{ track.duration_sec if track and track.duration_sec else '' }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Рабочая станция (DAW)</label>
                                <input type="text" name="daw" class="form-control" value="{{ track.daw if track and track.daw else '' }}">
                            </div>

                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                                <a href="{{ url_for('track_list') }}" class="btn btn-outline-secondary ms-2">Отмена</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function selectGenre(genre) {
            document.getElementById('genreInput').value = genre;
        }
    </script>
</body>
</html>
